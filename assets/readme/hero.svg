<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">lhg-pr — PR发稿专家</title>
  <desc id="desc">PR发稿专家：事件信息输入→通稿结构（标题/导语/正文/引言/结尾）→多版本输出（短讯/长稿/社媒版）→媒体清单→发布节奏表；5W1H/引言出处/极限词/错别字四重自查。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#0D1117"/>
  <line x1="688" y1="48" x2="688" y2="372" stroke="#30363D" stroke-width="1.5"/>

  <!-- 左：标题区 -->
  <g id="title-block">
    <text class="mono" x="56" y="80" font-size="17" letter-spacing="2" fill="#58A6FF">CLAUDE CODE PLUGIN · LHG-PLUGS</text>
    <text class="sans" x="56" y="142" font-size="54" font-weight="700" fill="#E6EDF3">lhg-pr</text>
    <text class="sans" x="56" y="188" font-size="23" font-weight="600" fill="#E6EDF3">PR发稿专家</text>

    <rect x="56" y="248" width="600" height="52" rx="10" fill="#1B2A3A" stroke="#30363D" stroke-width="1.5"/>
    <text class="mono" x="76" y="281" font-size="17" fill="#58A6FF">/plugin marketplace add lhg-plugs/lhg-pr</text>

    <text class="sans" x="56" y="340" font-size="17" fill="#8B949E">v1.0.0 · 3 命令 · 4 Skills · 2 Agents · MIT</text>
  </g>

  <!-- 右：能力卡片 -->
  <g id="capability">
    <text class="mono" x="720" y="80" font-size="16" letter-spacing="2" fill="#58A6FF">CAPABILITY · 成套交付</text>
    <g id="card-1">
      <rect x="720" y="96" width="424" height="56" rx="10" fill="#161B22"/>
      <text class="sans" x="744" y="121" font-size="20" font-weight="700" fill="#E6EDF3">命令</text>
      <text class="sans" x="1116" y="124" font-size="24" font-weight="700" fill="#58A6FF" text-anchor="end">3</text>
      <text class="sans" x="744" y="142" font-size="16" fill="#8B949E">pr / pr-check / pr-media</text>
    </g>
    <g id="card-2">
      <rect x="720" y="160" width="424" height="56" rx="10" fill="#161B22"/>
      <text class="sans" x="744" y="185" font-size="20" font-weight="700" fill="#E6EDF3">SKILLS</text>
      <text class="sans" x="1116" y="188" font-size="24" font-weight="700" fill="#58A6FF" text-anchor="end">4</text>
      <text class="sans" x="744" y="206" font-size="16" fill="#8B949E">lhg-pr-headline / lhg-pr-…</text>
    </g>
    <g id="card-3">
      <rect x="720" y="224" width="424" height="56" rx="10" fill="#161B22"/>
      <text class="sans" x="744" y="249" font-size="20" font-weight="700" fill="#E6EDF3">AGENTS</text>
      <text class="sans" x="1116" y="252" font-size="24" font-weight="700" fill="#58A6FF" text-anchor="end">2</text>
      <text class="sans" x="744" y="270" font-size="16" fill="#8B949E">editor / writer</text>
    </g>
    <g id="card-4">
      <rect x="720" y="288" width="424" height="56" rx="10" fill="#161B22"/>
      <text class="sans" x="744" y="313" font-size="20" font-weight="700" fill="#E6EDF3">冒烟测试</text>
      <text class="sans" x="1116" y="316" font-size="24" font-weight="700" fill="#58A6FF" text-anchor="end">46/46</text>
      <text class="sans" x="744" y="334" font-size="16" fill="#8B949E">python3 smoke_test.py 全绿</text>
    </g>
